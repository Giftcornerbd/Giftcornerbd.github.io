<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gift Corner BD</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f9f9f9; }
    h1 { text-align: center; color: #333; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; max-width: 1000px; margin: auto; }
    .card { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 6px; }
    .price { font-weight: bold; color: #e44d26; margin: 10px 0; }
    .buy-btn { display: inline-block; background: #25D366; color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px; font-weight: bold; }
  </style>
</head>
<body>

  <h1>Gift Corner BD</h1>
  <div class="product-grid" id="product-container">
    <p style="text-align:center;">প্রোডাক্ট লোড হচ্ছে...</p>
  </div>

  <script>
    const SUPABASE_URL = "https://xpjocpndczgeotojaltk.supabase.co";
    const SUPABASE_KEY = "EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhwam9jcG5kY3pnZW90b2phbHRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExMTczNjAsImV4cCI6MjEwNjY5MzM2MH0.o_NOXE-uJgLgfsVLOWEb-MJEids4DQnZPdyjKk_ggdw";
    
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function fetchProducts() {
      const { data: products, error } = await _supabase.from('Products').select('*');
      const container = document.getElementById('product-container');
      
      if (error) {
        container.innerHTML = '<p style="text-align:center;">প্রোডাক্ট লোড করতে সমস্যা হয়েছে</p>';
        return;
      }

      if (!products || products.length === 0) {
        container.innerHTML = '<p style="text-align:center;">এখনো কোনো প্রোডাক্ট যোগ করা হয়নি</p>';
        return;
      }

      container.innerHTML = '';
      products.forEach(product => {
        container.innerHTML += `
          <div class="card">
            <img src="${product.image_url}" alt="${product.title}">
            <h3>${product.title}</h3>
            <p class="price">মূল্য: ${product.price}</p>
            <a class="buy-btn" href="https://wa.me/8801701292003?text=আমি%20${encodeURIComponent(product.title)}%20অর্ডার%20করতে%20চাই" target="_blank">
              অর্ডার করুন
            </a>
          </div>
        `;
      });
    }

    fetchProducts();
  </script>
</body>
</html>
