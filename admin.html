<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Gift Corner BD</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f9; padding: 20px; margin: 0; }
    .container { max-width: 800px; margin: auto; }
    .form-box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 30px; }
    h2, h3 { text-align: center; color: #333; }
    input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    button:hover { background: #218838; }
    .product-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
    .card { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 12px; text-align: center; }
    .card img { width: 100%; height: 120px; object-fit: cover; border-radius: 5px; }
    .delete-btn { background: #dc3545; margin-top: 10px; }
    .delete-btn:hover { background: #c82333; }
  </style>
</head>
<body>

<div class="container">
  <div class="form-box">
    <h2>নতুন প্রোডাক্ট অ্যাড করুন</h2>
    <input type="text" id="title" placeholder="প্রোডাক্টের নাম">
    <input type="text" id="price" placeholder="দাম (যেমন: ৫০০ টাকা)">
    <input type="text" id="image_url" placeholder="ছবি URL (Image Link)">
    <button onclick="addProduct()">পাবলিশ করুন</button>
  </div>

  <h3>বর্তমান প্রোডাক্ট তালিকা</h3>
  <div class="product-list" id="admin-product-container">
    <p style="text-align:center;">প্রোডাক্ট লোড হচ্ছে...</p>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://xpjocpndczgeotojaltk.supabase.co";
  const SUPABASE_KEY = "EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhwam9jcG5kY3pnZW90b2phbHRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExMTczNjAsImV4cCI6MjEwNjY5MzM2MH0.o_NOXE-uJgLgfsVLOWEb-MJEids4DQnZPdyjKk_ggdw";
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function loadAdminProducts() {
    const { data: products, error } = await _supabase.from('Products').select('*');
    const container = document.getElementById('admin-product-container');
    
    if (error) {
      container.innerHTML = '<p style="text-align:center;">প্রোডাক্ট লোড করতে সমস্যা হয়েছে</p>';
      return;
    }

    if (!products || products.length === 0) {
      container.innerHTML = '<p style="text-align:center;">এখনো কোনো প্রোডাক্ট যোগ করা হয়নি</p>';
      return;
    }

    container.innerHTML = '';
    products.forEach(product => {
      container.innerHTML += `
        <div class="card">
          <img src="${product.image_url}" alt="${product.title}">
          <h4>${product.title}</h4>
          <p>মূল্য: ${product.price}</p>
          <button class="delete-btn" onclick="deleteProduct(${product.id})">ডিলিট করুন</button>
        </div>
      `;
    });
  }

  async function addProduct() {
    const title = document.getElementById('title').value;
    const price = document.getElementById('price').value;
    const image_url = document.getElementById('image_url').value;

    if (!title || !price || !image_url) {
      alert("সবগুলো ঘর পূরণ করুন!");
      return;
    }

    const { error } = await _supabase.from('Products').insert([{ title, price, image_url }]);

    if (error) {
      alert("সমস্যা হয়েছে: " + error.message);
    } else {
      alert("প্রোডাক্ট সফলভাবে যোগ হয়েছে!");
      document.getElementById('title').value = '';
      document.getElementById('price').value = '';
      document.getElementById('image_url').value = '';
      loadAdminProducts();
    }
  }

  async function deleteProduct(id) {
    if (confirm("আপনি কি নিশ্চিত যে এই প্রোডাক্টটি ডিলিট করতে চান?")) {
      const { error } = await _supabase.from('Products').delete().eq('id', id);
      if (error) {
        alert("ডিলিট করতে সমস্যা হয়েছে: " + error.message);
      } else {
        alert("প্রোডাক্ট সফলভাবে ডিলিট হয়েছে!");
        loadAdminProducts();
      }
    }
  }

  loadAdminProducts();
</script>

</body>
</html>
